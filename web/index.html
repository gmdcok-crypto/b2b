<!DOCTYPE html>
<html lang="ko" class="boot">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#12324d">
  <title>SCM B2B Portal</title>
  <link id="manifest" rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <script>
    (function () {
      var supplier = location.hostname === "b2bpart.netlify.app" || new URLSearchParams(location.search).get("portal") === "supplier";
      if (!supplier) return;
      document.title = "협력사 포털";
      document.getElementById("manifest").href = "manifest-supplier.webmanifest";
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">SCM</span>
        <div class="brand-text">
          <strong>구매 포털</strong>
          <span class="crumb" id="crumb">발주</span>
        </div>
      </div>
      <div class="session">
        <span class="session-key">구매사</span>
        <strong>(주)지에스테크</strong>
        <span class="sep" aria-hidden="true"></span>
        <span id="session-name"></span>
        <button type="button" id="logout" class="session-btn" hidden>로그아웃</button>
        <span class="sep" aria-hidden="true"></span>
        <time id="today"></time>
      </div>
    </header>
    <div class="body">
      <nav class="nav" aria-label="업무 메뉴">
        <p class="nav-label">업무</p>
        <button type="button" class="nav-item is-active" data-module="orders">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5.2L13 5.2V14.5H4z"/><path d="M9 1.8V5.4h3.4M6 8h5M6 10.5h5"/></svg>
          <span>발주</span>
        </button>
        <button type="button" class="nav-item" data-module="prices">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 8 3h5.5V8.5L8 14z"/><circle cx="11.2" cy="5.6" r="0.8" fill="currentColor" stroke="none"/></svg>
          <span>단가</span>
        </button>
        <button type="button" class="nav-item" data-module="items">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5 8 2.2 13.5 5 8 7.8zM2.5 5v6L8 13.8 13.5 11V5M8 7.8v6"/></svg>
          <span>품목</span>
        </button>
        <button type="button" class="nav-item" data-module="vendors">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 14.5h10M4.5 14.5V3.2h7v11.3M6.3 5.4h1.1M8.6 5.4h1.1M6.3 7.8h1.1M8.6 7.8h1.1M7 14.5v-2.4h2V14.5"/></svg>
          <span>협력사</span>
        </button>
        <button type="button" class="nav-item" data-module="audit">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10M3 8h10M3 12.5h6"/><circle cx="12.2" cy="12.2" r="2.2"/></svg>
          <span>이력</span>
        </button>
        <button type="button" class="nav-item" data-module="accounts" id="nav-accounts">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 8a2.6 2.6 0 1 0 0-5.2A2.6 2.6 0 0 0 8 8zm0 1.4c-2.4 0-4.4 1.2-4.4 2.7V13h8.8v-.9c0-1.5-2-2.7-4.4-2.7z"/></svg>
          <span>계정</span>
        </button>
        <p class="nav-foot">구매 담당</p>
      </nav>
      <div class="stage">
        <div class="command" id="command" role="toolbar" aria-label="작업"></div>
        <div class="criteria" id="criteria"></div>
        <div class="doc-tab" id="doc-tab"></div>
        <div class="composite" id="composite"></div>
      </div>
    </div>
    <footer class="statusbar" id="statusbar"></footer>
  </div>
  <article class="print-root" id="print-root"></article>
  <div class="notice" id="notice" hidden>
    <div class="notice-card" role="alertdialog" aria-modal="true" aria-labelledby="notice-text">
      <p id="notice-text"></p>
      <div class="notice-actions">
        <button type="button" class="btn" id="notice-cancel" hidden>취소</button>
        <button type="button" class="btn primary" id="notice-ok">확인</button>
      </div>
    </div>
  </div>
  <div class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <h1>(주)지에스테크 구매 포털</h1>
      <label id="login-user-label"><span>아이디</span> <input name="username" autocomplete="username" required></label>
      <label><span>비밀번호</span> <input name="password" type="password" autocomplete="current-password" required></label>
      <label id="login-confirm-label" hidden><span>비밀번호 확인</span> <input name="confirm" type="password" autocomplete="new-password"></label>
      <p class="login-error" id="login-error" role="alert"></p>
      <button type="submit" class="btn primary" id="login-submit">로그인</button>
      <div class="login-help" id="login-help">
        <p>1. 관리자·담당·승인자 아이디로 로그인합니다. 계정은 DB에서 관리합니다.</p>
        <p>2. 담당은 검토·반려, 승인자는 최종승인·반려, 관리자는 계정·마스터를 관리합니다.</p>
        <p>3. 계정 메뉴는 관리자만 사용할 수 있습니다.</p>
        <p>4. 최초 계정이 없으면 JWT_SECRET과 시드 변수를 한 번만 넣으세요.</p>
      </div>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
