<!DOCTYPE html>
<html lang="ko" class="boot">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#12324d">
  <title>SCM B2B Portal</title>
  <link id="manifest" rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <script>
    (function () {
      var supplier = location.hostname === "b2bpart.netlify.app" || new URLSearchParams(location.search).get("portal") === "supplier";
      if (!supplier) return;
      document.title = "협력사 포털";
      document.getElementById("manifest").href = "manifest-supplier.webmanifest";
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <span class="mark" aria-hidden="true">SCM</span>
        <div class="brand-text">
          <strong>구매 포털</strong>
          <span class="crumb" id="crumb">발주</span>
        </div>
      </div>
      <div class="session">
        <span class="session-key">구매사</span>
        <strong>(주)한성산업</strong>
        <span class="sep" aria-hidden="true"></span>
        <span id="session-name">김구매</span>
        <button type="button" id="logout" class="session-btn" hidden>로그아웃</button>
        <span class="sep" aria-hidden="true"></span>
        <time id="today"></time>
      </div>
    </header>
    <div class="body">
      <nav class="nav" aria-label="업무 메뉴">
        <p class="nav-label">업무</p>
        <button type="button" class="nav-item is-active" data-module="orders">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 1.5h5.2L13 5.2V14.5H4z"/><path d="M9 1.8V5.4h3.4M6 8h5M6 10.5h5"/></svg>
          <span>발주</span>
        </button>
        <button type="button" class="nav-item" data-module="prices">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5 8 3h5.5V8.5L8 14z"/><circle cx="11.2" cy="5.6" r="0.8" fill="currentColor" stroke="none"/></svg>
          <span>단가</span>
        </button>
        <button type="button" class="nav-item" data-module="items">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 5 8 2.2 13.5 5 8 7.8zM2.5 5v6L8 13.8 13.5 11V5M8 7.8v6"/></svg>
          <span>품목</span>
        </button>
        <button type="button" class="nav-item" data-module="vendors">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 14.5h10M4.5 14.5V3.2h7v11.3M6.3 5.4h1.1M8.6 5.4h1.1M6.3 7.8h1.1M8.6 7.8h1.1M7 14.5v-2.4h2V14.5"/></svg>
          <span>협력사</span>
        </button>
        <button type="button" class="nav-item" data-module="audit">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3.5h10M3 8h10M3 12.5h6"/><circle cx="12.2" cy="12.2" r="2.2"/></svg>
          <span>이력</span>
        </button>
        <p class="nav-foot">구매 담당</p>
      </nav>
      <div class="stage">
        <div class="command" id="command" role="toolbar" aria-label="작업"></div>
        <div class="criteria" id="criteria"></div>
        <div class="doc-tab" id="doc-tab"></div>
        <div class="composite" id="composite"></div>
      </div>
    </div>
    <footer class="statusbar" id="statusbar"></footer>
  </div>
  <article class="print-root" id="print-root"></article>
  <div class="login" id="login" hidden>
    <form class="login-card" id="login-form">
      <h1>구매 포털</h1>
      <label>아이디 <input name="username" autocomplete="username" required></label>
      <label>비밀번호 <input name="password" type="password" autocomplete="current-password" required></label>
      <p class="login-error" id="login-error" role="alert"></p>
      <button type="submit" class="btn primary">로그인</button>
    </form>
  </div>
  <script src="config.js"></script>
  <script src="js/sample.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
